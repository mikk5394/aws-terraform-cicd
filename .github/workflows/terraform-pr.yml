name: Terraform PR

#Runs on every PR to main that touches the infrastructure or this file
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-pr.yml"

#Least privilege by default, jobs ask for more only if they need it
permissions:
  contents: read

env:
  TF_VERSION: "1.15.7"
  AWS_REGION: "eu-north-1"

jobs:
  #Fast checks that need no AWS access at all
  checks:
    name: Format, validate and scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

      - name: Security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform

  #Only runs if the checks pass
  plan:
    name: Plan
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      #Swaps the GitHub OIDC token for short lived AWS credentials
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      #Posts the plan on the PR so reviewers don't have to dig through logs
      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            terraform show -no-color tfplan | head -c 60000
            echo '```'
          } > plan.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file plan.md